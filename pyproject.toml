[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uhi"
version = "1.0.0"
description = "Urban Heat Island index prediction for the EY Open Science AI & Data Challenge 2025"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Goey Qi Hang" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.2",
    "xarray>=2024.1",
    "dask[dataframe]>=2024.1",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=0.14,<1",
    "dask-geopandas>=0.4",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "odc-stac>=0.3",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
uhi-pipeline = "uhi.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E741"]
