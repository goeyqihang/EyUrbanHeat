# Minimal conda environment for macOS / Linux / Windows (conda-forge only).
# Versions follow environment.yml, the exact Windows environment used during the competition.
# Create it with:   conda env create -f environment-crossplatform.yml
name: EyUrbanHeat
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=1.26
  - pandas=2.2
  - xarray=2024.11
  - dask=2025.2
  - rasterio=1.3
  - rioxarray=0.18
  - geopandas=0.14
  - dask-geopandas=0.4
  - shapely=2.0
  - pyproj=3.6
  - pystac-client=0.8
  - planetary-computer=1.0
  - odc-stac=0.3
  - stackstac=0.5
  - xgboost=2.1
  - scikit-learn=1.3
  - matplotlib-base=3.10
  - seaborn=0.13
  - openpyxl=3.1
  - pillow
  - tqdm
  - jupyterlab
  - ipykernel
  - pytest
  - pip
  - pip:
      - -e .  # this repository's `uhi` package
